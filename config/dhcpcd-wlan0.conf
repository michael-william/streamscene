# StreamScene: force dhcpcd to recognize wlan0 as a wireless interface.
#
# Without this, dhcpcd doesn't reliably see wlan0's carrier state after
# wpa_supplicant associates: `dhcpcd -1 -4 wlan0` hung the full 30s and
# returned nothing on every attempt, even though wpa_cli showed
# wpa_state=COMPLETED within ~2s every time. This is a well-documented
# dhcpcd/wireless-driver interaction, not something specific to this
# codebase - see:
#   https://forums.raspberrypi.com/viewtopic.php?t=237670
#   https://rigacci.org/wiki/doku.php/doc/appunti/hardware/raspberrypi_wpa_supplicant_problem
#   https://bbs.archlinux.org/viewtopic.php?id=117204
#
# Appended to /etc/dhcpcd.conf at build time by build_sd_image.sh.
interface wlan0
env ifwireless=1
env wpa_supplicant_driver=nl80211,wext
